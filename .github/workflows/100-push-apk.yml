name: Build 100 PUSH APK

on:
  push:
    branches:
      - 100-push-pwa
    paths:
      - '100-push-pwa/android/**'
      - '.github/workflows/100-push-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check web app JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("100-push-pwa/index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          end = html.rfind("</script>")
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Could not find final script block")
          Path("/tmp/100-push-app.js").write_text(html[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/100-push-app.js

      - name: Install Android command-line tools and SDK 35
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: 100-push-pwa/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp 100-push-pwa/android/app/build/outputs/apk/debug/app-debug.apk 100-PUSH.apk
          sha256sum 100-PUSH.apk > 100-PUSH.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 100-PUSH-APK
          path: |
            100-PUSH.apk
            100-PUSH.sha256.txt
          if-no-files-found: error
          retention-days: 30
