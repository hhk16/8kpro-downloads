name: Build 100 PUSH APK

on:
  push:
    branches:
      - 100-push-pwa
    paths:
      - '100-push-pwa/android/**'
      - '.github/workflows/100-push-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: 100-push-pwa/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp 100-push-pwa/android/app/build/outputs/apk/debug/app-debug.apk 100-PUSH.apk
          sha256sum 100-PUSH.apk > 100-PUSH.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 100-PUSH-APK
          path: |
            100-PUSH.apk
            100-PUSH.sha256.txt
          if-no-files-found: error
          retention-days: 30
